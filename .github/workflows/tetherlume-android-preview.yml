name: Tetherlume Android preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'tetherlume/android/**'
      - '.github/workflows/tetherlume-android-preview.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tetherlume/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0' > /dev/null
      - name: Upload-Schluessel aus Secrets (optional)
        env:
          KS: ${{ secrets.TL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"; echo "TL_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"; echo "Signiertes AAB wird gebaut"; else echo "Keine Secrets: unsigniertes AAB"; fi
      - run: gradle --no-daemon assembleDebug bundleRelease lintDebug
        env:
          TL_KEYSTORE_PASSWORD: ${{ secrets.TL_KEYSTORE_PASSWORD }}
          TL_KEY_ALIAS: ${{ secrets.TL_KEY_ALIAS }}
          TL_KEY_PASSWORD: ${{ secrets.TL_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: tetherlume-android-test
          path: |
            tetherlume/android/app/build/outputs/apk/debug/*.apk
            tetherlume/android/app/build/outputs/bundle/release/*.aab
            tetherlume/android/app/build/reports/lint-results-debug.html
          retention-days: 7
      - name: APK als Download veroeffentlichen (nur main)
        if: github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tetherlume/android/app/build/outputs/apk/debug/app-debug.apk Tetherlume.apk
          gh release view tetherlume-android-latest >/dev/null 2>&1 || gh release create tetherlume-android-latest --title "Tetherlume Android (Test-Version)" --notes "Automatisch gebaute Test-APK. Zum Installieren am Handy 'Unbekannte Apps installieren' erlauben." --prerelease
          gh release upload tetherlume-android-latest Tetherlume.apk --clobber
