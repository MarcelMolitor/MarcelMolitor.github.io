name: Tetherlume Android preview
on:
  workflow_dispatch:
  push:
    paths:
      - 'tetherlume/android/**'
      - '.github/workflows/tetherlume-android-preview.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tetherlume/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle --no-daemon assembleDebug bundleRelease lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: tetherlume-android-test
          path: |
            tetherlume/android/app/build/outputs/apk/debug/*.apk
            tetherlume/android/app/build/outputs/bundle/release/*.aab
            tetherlume/android/app/build/reports/lint-results-debug.html
          retention-days: 7
