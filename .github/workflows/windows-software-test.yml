name: Windows software build and smoke test
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-desk/**'
      - 'fotolimit/**'
      - 'qr-bruecke/**'
      - 'displayfit/**'
      - '.github/workflows/windows-software-test.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Zig 0.13.0
        shell: pwsh
        run: |
          $index = Invoke-RestMethod https://ziglang.org/download/index.json
          $release = $index.'0.13.0'.'x86_64-windows'
          $archive = Join-Path $env:RUNNER_TEMP zig.zip
          Invoke-WebRequest $release.tarball -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $release.shasum) { throw 'Zig checksum mismatch' }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          $zig = Get-ChildItem $env:RUNNER_TEMP -Directory -Filter 'zig-windows-x86_64-0.13.0' | Select-Object -First 1
          if (!$zig) { throw 'Zig not found' }
          $zig.FullName | Out-File $env:GITHUB_PATH -Append -Encoding utf8
      - name: Build all four applications
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:GITHUB_WORKSPACE 'build-windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          Push-Location android-desk
          zig rc /fo icon.res src/app.rc
          zig cc -target x86_64-windows-gnu -Os -s -municode -Wl,--subsystem,windows src/main.c icon.res -lcomdlg32 -ladvapi32 -lshell32 -luser32 -o "$out/MOLITOR-Android-Desk.exe"
          Pop-Location
          Push-Location fotolimit
          git clone https://github.com/nothings/stb.git stb
          git -C stb checkout 6b5799bae8a1fe3792691ef4b72ae26434c3e799
          zig cc -target x86_64-windows-gnu -O2 -s -municode -Wl,--subsystem,windows -Istb fotolimit.c -lcomdlg32 -luser32 -o "$out/MOLITOR-FotoLimit.exe"
          Pop-Location
          Push-Location qr-bruecke
          zig rc /fo qr.res dialog.rc
          zig cc -target x86_64-windows-gnu -Os -s -municode -Wl,--subsystem,windows app.c qrcodegen.c qr.res -lgdi32 -luser32 -o "$out/QR-Bruecke.exe"
          Pop-Location
          Push-Location displayfit
          git clone https://github.com/nothings/stb.git stb
          git -C stb checkout 6b5799bae8a1fe3792691ef4b72ae26434c3e799
          zig cc -target x86_64-windows-gnu -O2 -s -municode -Wl,--subsystem,windows -Istb app.c -lcomdlg32 -luser32 -o "$out/DisplayFit.exe"
          Pop-Location
      - name: Smoke test executable startup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in Get-ChildItem build-windows -Filter *.exe) {
            $p = Start-Process -FilePath $file.FullName -PassThru
            try {
              Start-Sleep -Seconds 4
              $p.Refresh()
              if ($p.HasExited) { throw "$($file.Name) exited early: $($p.ExitCode)" }
              Write-Host "Startup smoke test: $($file.Name)"
            } finally {
              if (!$p.HasExited) { $null = $p.CloseMainWindow(); if (!$p.WaitForExit(3000)) { Stop-Process -Id $p.Id -Force } }
            }
          }
          $files = Get-ChildItem build-windows -Filter *.exe
          if ($files.Count -ne 4) { throw 'Expected four executables' }
          $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)" } | Set-Content build-windows/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-test-builds
          path: build-windows/
          retention-days: 7
