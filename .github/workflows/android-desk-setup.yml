name: Tetherlume Setup
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-desk-setup.yml'
      - 'android-desk/src/**'
      - 'android-desk/installer/**'
permissions:
  contents: write
concurrency:
  group: android-desk-setup-release
  cancel-in-progress: false
jobs:
  setup:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $release = (Invoke-RestMethod https://ziglang.org/download/index.json).'0.13.0'.'x86_64-windows'
          $archive = Join-Path $env:RUNNER_TEMP zig.zip
          Invoke-WebRequest $release.tarball -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne $release.shasum) { throw 'Zig checksum mismatch' }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          $zig = Join-Path $env:RUNNER_TEMP 'zig-windows-x86_64-0.13.0/zig.exe'
          Set-Location android-desk
          New-Item -ItemType Directory -Force installer/payload | Out-Null
          & $zig rc /fo icon.res src/app.rc
          & $zig cc -target x86_64-windows-gnu -Os -s -municode '-Wl,--subsystem,windows' src/main.c icon.res -lcomdlg32 -ladvapi32 -lshell32 -luser32 -lgdi32 -lwinhttp -o installer/payload/Android-Desk.exe
      - name: Fetch and verify bundled scrcpy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path $env:RUNNER_TEMP scrcpy.zip
          Invoke-WebRequest 'https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-win64-v5.0.1.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne 'b12a2c4ee8be317422451fc7dcf8ee20a71b5ea7ef9ad73ddd825a25316227a5') { throw 'scrcpy checksum mismatch' }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP scrcpy)
          Copy-Item (Join-Path $env:RUNNER_TEMP 'scrcpy/scrcpy-win64-v5.0.1') android-desk/installer/payload/scrcpy -Recurse
      - name: Compile setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw 'Inno Setup 6 missing from runner' }
          & $iscc android-desk/installer/Android-Desk.iss
      - name: Test installation and local scrcpy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP AndroidDeskTest
          $setup = (Resolve-Path android-desk/installer/output/Tetherlume-Setup.exe).Path
          $p = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $dir + '"')) -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "Setup failed: $($p.ExitCode)" }
          foreach ($file in @('Android-Desk.exe','scrcpy/scrcpy.exe','scrcpy/adb.exe','LICENSE-Android-Desk.txt','THIRD-PARTY.txt','PRIVACY.md')) {
            if (!(Test-Path (Join-Path $dir $file))) { throw "Missing installed file: $file" }
          }
          & (Join-Path $dir 'scrcpy/scrcpy.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'scrcpy version check failed' }
          $app = Start-Process (Join-Path $dir 'Android-Desk.exe') -PassThru
          try {
            Start-Sleep -Seconds 4
            $app.Refresh()
            if ($app.HasExited) { throw 'Launcher exited early' }
          } finally {
            if (!$app.HasExited) { $null = $app.CloseMainWindow(); if (!$app.WaitForExit(3000)) { Stop-Process -Id $app.Id -Force } }
          }
          # Verify an ordinary in-place upgrade before publishing the installer.
          $upgrade = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $dir + '"')) -PassThru -Wait
          if ($upgrade.ExitCode -ne 0) { throw "Upgrade failed: $($upgrade.ExitCode)" }
          foreach ($file in @('Android-Desk.exe','scrcpy/scrcpy.exe','scrcpy/adb.exe','scrcpy/AdbWinApi.dll')) {
            if (!(Test-Path (Join-Path $dir $file))) { throw "Missing file after upgrade: $file" }
          }
          & (Join-Path $dir 'scrcpy/scrcpy.exe') --version
          if ($LASTEXITCODE -ne 0) { throw 'scrcpy failed after upgrade' }
          $u = Start-Process (Join-Path $dir 'unins000.exe') -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -PassThru -Wait
          if ($u.ExitCode -ne 0) { throw 'Uninstall failed' }
          (Get-FileHash $setup -Algorithm SHA256).Hash | Set-Content android-desk/installer/output/SHA256.txt
      - name: Defender scan when available
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue) {
            $status = Get-MpComputerStatus
            if ($status.AntivirusEnabled) {
              Start-MpScan -ScanType CustomScan -ScanPath (Resolve-Path android-desk/installer/output).Path
              Write-Host 'Scan invoked; review Defender results before release.'
            } else { Write-Warning 'Defender disabled; manual scan required.' }
          } else { Write-Warning 'Defender unavailable; manual scan required.' }
      - uses: actions/upload-artifact@v4
        with:
          name: Tetherlume-Setup-test
          path: android-desk/installer/output/
          retention-days: 7
      - name: Setup als oeffentlichen Download veroeffentlichen
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = 'android-desk/installer/output'
          gh release view tetherlume-windows-latest 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { gh release create tetherlume-windows-latest --title 'Tetherlume fuer Windows' --notes 'Tetherlume-Setup fuer Windows 10/11 (64 Bit) inkl. scrcpy. Android per USB am PC steuern. Pruefsumme: SHA256.txt' }
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed' }
          gh release upload tetherlume-windows-latest "$out/Tetherlume-Setup.exe" "$out/SHA256.txt" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
