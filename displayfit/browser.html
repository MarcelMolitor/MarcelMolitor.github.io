<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DisplayFit Web – Phone Wallpaper Editor</title><meta name="description" content="Crop your own photos into phone wallpapers locally in your browser."><link rel="canonical" href="https://marcelmolitor.github.io/displayfit/browser.html"><style>*{box-sizing:border-box}body{margin:0;background:#f2f5fa;color:#17243a;font:16px/1.5 system-ui}main,nav,footer{max-width:1100px;margin:auto;padding:20px}nav{display:flex;align-items:center;gap:12px;flex-wrap:wrap}nav strong{margin-right:auto}a{color:#3458d4}header{background:#173354;color:white;border-radius:20px;padding:24px}h1{margin:0;font-size:clamp(28px,5vw,44px)}.studio{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}.panel{background:white;border:1px solid #d5deeb;border-radius:16px;padding:20px}label{display:block;margin:16px 0}input,select,button{font:inherit;max-width:100%}button,select{min-height:44px;border-radius:8px;padding:8px 14px;border:1px solid #94a3b8}button{background:#3458d4;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}input[type=range]{width:100%}canvas{display:block;width:auto;max-width:100%;height:auto;max-height:65vh;margin:auto;background:#e2e8f0} :focus-visible{outline:3px solid #3458d4;outline-offset:3px}@media(max-width:700px){.studio{grid-template-columns:1fr}}</style></head><body><nav><strong>DisplayFit Web</strong><a href="./" id="desktop">Windows app</a><button id="lang">Deutsch</button></nav><main><header><h1 id="heading">Your photo. Your wallpaper.</h1><p id="intro">Create phone wallpapers locally, without uploading your images.</p></header><div class="studio"><section class="panel"><h2 id="controls">Image settings</h2><label><span id="choose">Choose JPEG or PNG</span><input id="file" type="file" accept="image/jpeg,image/png"></label><label><span id="size">Output size</span> <select id="format"><option value="1080,1920">1080 × 1920 (9:16)</option><option value="1080,2400">1080 × 2400 (20:9)</option><option value="1440,3200">1440 × 3200 (20:9)</option></select></label><label><span id="zoomlabel">Zoom</span><input id="zoom" type="range" min="1" max="3" step=".01" value="1"></label><label><span id="xlabel">Horizontal position</span><input id="x" type="range" min="0" max="100" value="50"></label><label><span id="ylabel">Vertical position</span><input id="y" type="range" min="0" max="100" value="50"></label><button id="save" disabled>Save JPEG</button> <button id="reset" type="button">Reset crop</button><p id="status" role="status"></p></section><section class="panel"><h2 id="preview">Preview</h2><canvas id="canvas" width="1080" height="1920"></canvas></section></div></main><footer>Marcel Molitor · <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Privacy / Datenschutz</a></footer><script>const $=id=>document.getElementById(id);let img=null,de=false,seq=0;const words={reset:["Reset crop","Ausschnitt zurücksetzen"],heading:["Your photo. Your wallpaper.","Dein Foto. Dein Hintergrund."],intro:["Create phone wallpapers locally, without uploading your images.","Erstelle Handy-Hintergründe lokal, ohne Bild-Upload."],controls:["Image settings","Bildeinstellungen"],choose:["Choose JPEG or PNG","JPEG oder PNG auswählen"],size:["Output size","Ausgabegröße"],zoomlabel:["Zoom","Zoom"],xlabel:["Horizontal position","Horizontale Position"],ylabel:["Vertical position","Vertikale Position"],save:["Save JPEG","JPEG speichern"],preview:["Preview","Vorschau"],desktop:["Windows app","Windows-App"]};function language(){document.documentElement.lang=de?"de":"en";for(const [id,v] of Object.entries(words))$(id).textContent=v[+de];$("lang").textContent=de?"English":"Deutsch";$("desktop").href=de?"./de.html":"./";$("status").textContent=""}de=(new URLSearchParams(location.search).get("lang")||navigator.language).toLowerCase().startsWith("de");language();$("lang").onclick=()=>{de=!de;language()};function draw(){const [w,h]=$("format").value.split(",").map(Number),c=$("canvas");c.width=w;c.height=h;const ctx=c.getContext("2d");ctx.fillStyle="#fff";ctx.fillRect(0,0,w,h);if(!img)return;const scale=Math.max(w/img.width,h/img.height)*Number($("zoom").value),iw=img.width*scale,ih=img.height*scale;ctx.drawImage(img,(w-iw)*Number($("x").value)/100,(h-ih)*Number($("y").value)/100,iw,ih)}$("file").onchange=async()=>{const token=++seq,f=$("file").files[0];if(img)img.close();img=null;$("save").disabled=true;draw();if(!f)return;try{if(!["image/jpeg","image/png"].includes(f.type)||f.size>20000000)throw Error();const b=await createImageBitmap(f);if(token!==seq){b.close();return}if(b.width*b.height>36000000){b.close();throw Error()}img=b;draw();$("save").disabled=false;$("status").textContent=de?"Bild geladen.":"Image loaded."}catch(e){if(token===seq)$("status").textContent=de?"Bild nicht unterstützt (max. 20 MB, 36 MP).":"Unsupported image (max. 20 MB, 36 MP)."}};$("reset").onclick=()=>{$("zoom").value=1;$("x").value=50;$("y").value=50;draw()};for(const id of ["format","zoom","x","y"])$(id).oninput=draw;$("save").onclick=()=>{$("canvas").toBlob(b=>{if(!b)return;const u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download="displayfit-wallpaper.jpg";a.click();setTimeout(()=>URL.revokeObjectURL(u),30000)},"image/jpeg",.92)};draw();</script></body></html>
