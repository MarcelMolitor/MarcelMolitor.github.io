<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOLITOR · eBook Reader</title><meta name="theme-color" content="#142d40"><style>*{box-sizing:border-box}body{margin:0;background:#f5f2e9;color:#142d40;font:16px system-ui}header{background:#142d40;color:white;padding:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}header a{color:white}button,select{font:inherit;padding:10px;border:1px solid #9aacae;border-radius:8px;background:white;color:#142d40}#viewer{height:calc(100dvh - 180px);min-height:240px;max-width:1000px;margin:auto}nav{display:flex;justify-content:center;gap:12px;padding:12px;flex-wrap:wrap}#status{text-align:center;padding:8px}body.dark{background:#17242d;color:#eee}a{color:inherit}</style><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><script src="https://cdn.jsdelivr.net/npm/epubjs@0.3.93/dist/epub.min.js"></script></head><body><header><a href="/ecs-lesereihe/">← Bibliothek</a><strong>MOLITOR READER</strong><button id="theme">Nachtmodus</button><button id="minus">A−</button><button id="plus">A+</button><select id="toc" aria-label="Kapitel"><option value="">Kapitel wählen</option></select></header><div id="status" role="status">Buch wird geladen …</div><main id="viewer"></main><nav><button id="prev">← Zurück</button><button id="next">Weiter →</button><a id="download" download>EPUB laden</a></nav><script>const q=id=>document.getElementById(id);const allowed=['kuechenlabor','gegenprobe','bildatlas'];const path=new URLSearchParams(location.search).get('book');let rendition,size=110,dark=false;const key='molitor-reader:'+path;function save(k,v){try{localStorage.setItem(k,v)}catch{}}function read(k){try{return localStorage.getItem(k)}catch{return null}}async function init(){if(!allowed.some(x=>path==='/ecs-lesereihe/'+x+'.epub'))throw Error('Bitte ein Buch in der Bibliothek auswählen.');q('download').href=path;if(!window.ePub)throw Error('Reader-Bibliothek konnte nicht geladen werden.');const response=await fetch(path);if(!response.ok)throw Error('Buchdatei nicht erreichbar.');const book=ePub(await response.arrayBuffer());rendition=book.renderTo('viewer',{width:'100%',height:'100%',spread:'none',allowScriptedContent:false});rendition.themes.register('light',{body:{background:'#f5f2e9',color:'#142d40'}});rendition.themes.register('dark',{body:{background:'#17242d',color:'#eee'}});rendition.themes.select('light');rendition.themes.fontSize(size+'%');rendition.on('relocated',loc=>{save(key,loc.start.cfi);q('status').textContent='Leseposition gespeichert · '+(loc.start.displayed?.page||1)+' / '+(loc.start.displayed?.total||1)+' im Abschnitt'});const saved=read(key);try{await rendition.display(saved||undefined)}catch{await rendition.display()}const n=await book.loaded.navigation;function add(items,depth=0){for(const i of items){const o=document.createElement('option');o.value=i.href;o.textContent='—'.repeat(depth)+i.label;q('toc').append(o);add(i.subitems||[],depth+1)}}add(n.toc);q('toc').onchange=()=>{if(q('toc').value)rendition.display(q('toc').value)};q('prev').onclick=()=>rendition.prev();q('next').onclick=()=>rendition.next();q('plus').onclick=()=>rendition.themes.fontSize((size=Math.min(220,size+10))+'%');q('minus').onclick=()=>rendition.themes.fontSize((size=Math.max(80,size-10))+'%');q('theme').onclick=()=>{dark=!dark;document.body.classList.toggle('dark',dark);rendition.themes.select(dark?'dark':'light');q('theme').textContent=dark?'Tagmodus':'Nachtmodus'};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')rendition.next();if(e.key==='ArrowLeft')rendition.prev()})}init().catch(e=>q('status').textContent=e.message+' – EPUB-Download als Alternative nutzen.');</script></body></html>
